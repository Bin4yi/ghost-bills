[project]
name = "ghost-bills"
version = "0.1.0"
description = "Find the ghost subscriptions in your bank statement. Runs 100% on your laptop with Gemma."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "langgraph>=0.2",
    "langchain-ollama>=0.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
